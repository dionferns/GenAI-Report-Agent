version: "3.9"

services:
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      - LLM_PROVIDER=anthropic
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - SQLITE_DB_PATH=/app/data/archive.db
      - LOG_FILE=/app/logs/agent.log
      - DEFAULT_TOPIC=uk_ai_regulation
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - chroma

  chroma:
    image: ghcr.io/chroma-core/chroma:latest
    ports:
      - "8000:8000"
    environment:
      - PERSIST_DIRECTORY=/chroma_data
      - IS_PERSISTENT=TRUE
    volumes:
      - ./data/chroma:/chroma_data
